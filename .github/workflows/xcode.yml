name: Xcode

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select and boot compatible iPad Simulator
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl shutdown all || true
          xcrun simctl delete unavailable || true
          xcrun simctl list devices available --json > "$RUNNER_TEMP/simulators.json"
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json, os
          path = os.path.join(os.environ["RUNNER_TEMP"], "simulators.json")
          data = json.load(open(path, encoding="utf-8"))
          candidates = []
          for runtime, devices in data.get("devices", {}).items():
              if "SimRuntime.iOS-18-" not in runtime:
                  continue
              for device in devices:
                  if device.get("isAvailable") and device.get("name") == "iPad Pro 13-inch (M4)":
                      candidates.append((runtime, device["udid"]))
          if not candidates:
              raise SystemExit("No Xcode 16.4-compatible iOS 18.x iPad Pro 13-inch (M4) Simulator was found")
          runtime, udid = sorted(candidates, reverse=True)[0]
          print(f"SIMULATOR_UDID={udid}")
          print(f"SIMULATOR_RUNTIME={runtime}")
          PY
          source "$GITHUB_ENV"
          xcrun simctl boot "$SIMULATOR_UDID"
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          xcrun simctl list devices available

      - name: Build Release without instrumentation
        run: >-
          xcodebuild build
          -project Forge3D.xcodeproj
          -scheme Forge3D
          -configuration Release
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO

      - name: Build for booted iPad Simulator
        run: >-
          xcodebuild build-for-testing
          -project Forge3D.xcodeproj
          -scheme Forge3D
          -configuration Debug
          -destination "platform=iOS Simulator,id=$SIMULATOR_UDID"
          -destination-timeout 120
          CODE_SIGNING_ALLOWED=NO

      - name: Run and validate XCTest
        shell: bash
        run: |
          set -uo pipefail
          RESULT_BUNDLE="$RUNNER_TEMP/Forge3DTests.xcresult"
          RAW_LOG="$RUNNER_TEMP/Forge3DTests.log"
          SUMMARY_JSON="$RUNNER_TEMP/Forge3DTests-summary.json"
          rm -rf "$RESULT_BUNDLE"
          set +e
          xcodebuild test-without-building \
            -project Forge3D.xcodeproj \
            -scheme Forge3D \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -destination-timeout 120 \
            -resultBundlePath "$RESULT_BUNDLE" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RAW_LOG"
          XCODE_STATUS=${PIPESTATUS[0]}
          set -e
          test -d "$RESULT_BUNDLE"
          xcrun xcresulttool get test-results summary \
            --path "$RESULT_BUNDLE" --format json > "$SUMMARY_JSON"
          python3 - "$SUMMARY_JSON" "$RAW_LOG" "$XCODE_STATUS" <<'PY'
          import json, pathlib, sys
          summary_path, log_path, xcode_status = sys.argv[1], sys.argv[2], int(sys.argv[3])
          data = json.load(open(summary_path, encoding="utf-8"))
          def count(name):
              value = data.get(name, 0)
              return len(value) if isinstance(value, list) else int(value or 0)
          total = count("totalTestCount")
          failed = count("failedTests")
          skipped = count("skippedTests")
          passed = total - failed - skipped
          log = pathlib.Path(log_path).read_text(encoding="utf-8", errors="replace")
          expected_bundle = "EdgeSelectionTests" in log and "Forge3D" in log
          print(f"XCTEST_SUMMARY total={total} passed={passed} failed={failed} skipped={skipped}")
          print(f"XCTEST_HOST_LAUNCHED={total > 0}")
          print(f"XCTEST_EXPECTED_BUNDLE={expected_bundle}")
          if xcode_status != 0 or total <= 0 or failed != 0 or passed < 0 or not expected_bundle:
              raise SystemExit(1)
          PY

      - name: Collect XCTest failure diagnostics
        if: failure()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/xcode-diagnostics"
          xcrun simctl list devices > "$RUNNER_TEMP/xcode-diagnostics/devices.txt" || true
          xcrun simctl listapps "$SIMULATOR_UDID" > "$RUNNER_TEMP/xcode-diagnostics/apps.txt" || true
          xcrun simctl spawn "$SIMULATOR_UDID" log show --last 20m \
            --style compact --predicate 'process == "Forge3D" OR process == "testmanagerd"' \
            > "$RUNNER_TEMP/xcode-diagnostics/simulator.log" 2>&1 || true
          (cd "$RUNNER_TEMP/xcode-diagnostics" && xcrun simctl diagnose) \
            > "$RUNNER_TEMP/xcode-diagnostics/simctl-diagnose.log" 2>&1 || true
          cp -R "$HOME/Library/Logs/DiagnosticReports" "$RUNNER_TEMP/xcode-diagnostics/DiagnosticReports" 2>/dev/null || true
          cp -R "$RUNNER_TEMP/Forge3DTests.xcresult" "$RUNNER_TEMP/xcode-diagnostics/" 2>/dev/null || true
          cp "$RUNNER_TEMP/Forge3DTests.log" "$RUNNER_TEMP/xcode-diagnostics/" 2>/dev/null || true
          cp "$RUNNER_TEMP/Forge3DTests-summary.json" "$RUNNER_TEMP/xcode-diagnostics/" 2>/dev/null || true

      - name: Upload XCTest failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-test-diagnostics
          path: ${{ runner.temp }}/xcode-diagnostics
          if-no-files-found: error
          retention-days: 7

      - name: Shutdown Simulator
        if: always()
        run: xcrun simctl shutdown "$SIMULATOR_UDID" || true
